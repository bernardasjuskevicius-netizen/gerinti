<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kWh → € · gerinti.lt</title>
  <meta name="description" content="Suskaičiuok elektros kainą pagal suvartojimą (kWh) ir kainą €/kWh." />
  <meta name="theme-color" content="#11b3a8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="/">gerinti.lt</a>
      <nav aria-label="Pagrindinis meniu">
        <a href="/statyba/">Statyba</a>
        <a href="/inzinerija/">Inžinerija</a>
        <a href="/energija/">Energija</a>
        <a href="/miestas/">Miestas</a>
        <a href="/irankiai/">Įrankiai</a>
      </nav>
      <div class="kebab" title="Meniu (vėliau)">…</div>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="page">
    <h1>kWh → €</h1>
    <p>Įvesk savo suvartojimą ir kainą. Rezultatas: <strong>€</strong>.</p>

    <form class="form" onsubmit="return false;">
      <div class="row">
        <div>
          <label for="kwh">Suvartojimas (kWh)</label>
          <input id="kwh" type="number" inputmode="decimal" min="0" step="0.01" placeholder="pvz., 350" />
          <small class="hint">Mėnesio ar periodo kWh.</small>
        </div>
        <div>
          <label for="eurkwh">Kaina (€/kWh)</label>
          <input id="eurkwh" type="number" inputmode="decimal" min="0" step="0.0001" placeholder="pvz., 0.25" />
          <small class="hint">Su PVM (jei taip skaičiuoji) – kaip tau patogiau.</small>
        </div>
      </div>

      <button class="btn" id="calc">Skaičiuoti</button>
      <div class="result" id="out">Įvesk skaičius.</div>
    </form>

    <p style="margin-top:14px"><a class="go" href="/irankiai/">← Visi įrankiai</a></p>
  </section>
  <footer>© 2026 gerinti.lt</footer>
</main>

<script src="/assets/site.js"></script>
<script>
  const kwh = document.getElementById('kwh');
  const eurkwh = document.getElementById('eurkwh');
  const out = document.getElementById('out');
  document.getElementById('calc').addEventListener('click', () => {
    const a = parseFloat(kwh.value);
    const b = parseFloat(eurkwh.value);
    if (!isFinite(a) || !isFinite(b)) { out.textContent = 'Įvesk kWh ir €/kWh.'; return; }
    const total = a * b;
    out.textContent = 'Kaina: ' + total.toFixed(2) + ' €';
  });
</script>
</body>
</html>
