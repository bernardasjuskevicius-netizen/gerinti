<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Galia (W/m²) · gerinti.lt</title>
  <meta name="description" content="Suskaičiuok reikiamą galią iš ploto (m²) ir specifinės galios (W/m²)." />
  <meta name="theme-color" content="#11b3a8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css" />
</head>
<body>
<header>
  <div class="wrap">
    <div class="topbar">
      <a class="brand" href="/">gerinti.lt</a>
      <nav aria-label="Pagrindinis meniu">
        <a href="/statyba/">Statyba</a>
        <a href="/inzinerija/">Inžinerija</a>
        <a href="/energija/">Energija</a>
        <a href="/miestas/">Miestas</a>
        <a href="/irankiai/">Įrankiai</a>
      </nav>
      <div class="kebab" title="Meniu (vėliau)">…</div>
    </div>
  </div>
</header>
<main class="wrap">
  <section class="page">
    <h1>Galia (W/m²)</h1>
    <p>Greitas paskaičiavimas: <strong>W = m² × W/m²</strong>. Grąžina W ir kW.</p>

    <form class="form" onsubmit="return false;">
      <div class="row">
        <div>
          <label for="area">Plotas (m²)</label>
          <input id="area" type="number" inputmode="decimal" min="0" step="0.01" placeholder="pvz., 80" />
          <small class="hint">Patalpos, buto, zonos plotas.</small>
        </div>
        <div>
          <label for="wpm2">Specifinė galia (W/m²)</label>
          <input id="wpm2" type="number" inputmode="decimal" min="0" step="1" placeholder="pvz., 50" />
          <small class="hint">Tipiškai 30–80 W/m² (labai priklauso nuo pastato).</small>
        </div>
      </div>

      <button class="btn" id="calc">Skaičiuoti</button>
      <div class="result" id="out">Įvesk skaičius.</div>
    </form>

    <p style="margin-top:14px"><a class="go" href="/irankiai/">← Visi įrankiai</a></p>
  </section>
  <footer>© 2026 gerinti.lt</footer>
</main>

<script src="/assets/site.js"></script>
<script>
  const area = document.getElementById('area');
  const wpm2 = document.getElementById('wpm2');
  const out = document.getElementById('out');
  document.getElementById('calc').addEventListener('click', () => {
    const a = parseFloat(area.value);
    const b = parseFloat(wpm2.value);
    if (!isFinite(a) || !isFinite(b)) { out.textContent = 'Įvesk m² ir W/m².'; return; }
    const w = a * b;
    const kw = w / 1000;
    out.textContent = 'Reikalinga galia: ' + Math.round(w) + ' W (' + kw.toFixed(2) + ' kW)';
  });
</script>
</body>
</html>
