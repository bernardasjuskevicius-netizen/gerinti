<!doctype html>
<html lang="lt">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>gerinti.lt – Prisijungimas</title>
  <style>
    body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;margin:40px;background:#f6fffd;color:#0b1f1d}
    .box{max-width:560px;padding:18px;border:1px solid rgba(9,42,38,.12);border-radius:14px;background:#fff}
    .btn{
      display:inline-block;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(9,42,38,.16);
      background:#11b3a8;
      color:#fff;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
      user-select:none;
      margin-right:10px;
    }
    .btn.secondary{background:#fff;color:#0b1f1d}
    p{line-height:1.55;color:rgba(11,31,29,.75)}
    .status{margin-top:10px;font-size:13px;color:rgba(11,31,29,.65)}
    code{background:#eef;padding:2px 6px;border-radius:6px}
  </style>
</head>
<body>
  <div class="box">
    <h1>Prisijungimas / slaptažodis</h1>
    <p>Šitas puslapis skirtas invite / recovery nuorodoms. Jei atėjai per kvietimą – URL turi turėti <code>#invite_token=...</code>.</p>

    <a class="btn" href="#" id="openBtn">Atidaryti prisijungimą</a>
    <a class="btn secondary" href="/admin/" id="goAdmin" style="display:none;">Eiti į /admin</a>

    <div class="status" id="status">Kraunasi Identity widget…</div>
  </div>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    (function () {
      const statusEl = document.getElementById("status");
      const openBtn = document.getElementById("openBtn");
      const goAdmin = document.getElementById("goAdmin");

      function setStatus(msg){ statusEl.textContent = msg; }

      function openWidget(){
        if (!window.netlifyIdentity) {
          setStatus("❌ Identity widget neužsikrovė (greičiausiai blokuoja adblock/extension arba tinklas).");
          return;
        }
        window.netlifyIdentity.open();
        setStatus("✅ Identity langas turėtų būti atsidaręs (jei ne – patikrink ar ne už kito lango).");
      }

      openBtn.addEventListener("click", function(e){
        e.preventDefault();
        openWidget();
      });

      if (!window.netlifyIdentity) {
        setStatus("❌ Identity widget neužsikrovė (blokuojamas).");
        return;
      }

      window.netlifyIdentity.on("init", function(user) {
        if (user) {
          setStatus("✅ Jau prisijungta. Gali eiti į /admin/.");
          goAdmin.style.display = "inline-block";
          return; // NIEKO neredirectinam automatiškai
        }
        setStatus("✅ Identity widget užsikrovė. Gali spausti mygtuką.");
        const h = window.location.hash || "";
        if (h.includes("invite_token") || h.includes("recovery_token") || h.includes("confirmation_token")) {
          openWidget();
        }
      });

      // SVARBU: jokio auto redirect on login
      // window.netlifyIdentity.on("login", ... ) – tyčia nenaudojam.

      window.netlifyIdentity.init();
    })();
  </script>
</body>
</html>
